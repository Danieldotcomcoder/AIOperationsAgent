[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# The URL is supplied by migrations/env.py from Settings. Leaving it empty here keeps
# credentials out of a committed file.
sqlalchemy.url =

# Timestamped, descriptive filenames so the history reads in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]
# exec, not console_scripts: the entrypoint form resolves against Alembic's own
# process metadata and is missing whenever dev extras are not installed.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
